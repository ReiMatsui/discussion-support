: 119100, "end_ms": 120480, "speaker": "未確定", "text": "ホチにツッコミしろを与えてたんや。"}, {"turn_id": 43, "ms": 120660, "end_ms": 120960, "speaker": "未確定", "text": "そうやな。"}, {"turn_id": 44, "ms": 121080, "end_ms": 123480, "speaker": "未確定", "text": "こういうのばっかりツッコまれてた、確かに。"}, {"turn_id": 45, "ms": 123660, "end_ms": 131160, "speaker": "参加者A", "text": "で、まあ最初にね、たぶん誰やねんっていうのはあると思うんで、経歴というか、どういう人生を送ってきて、今どういう状態かちょっと聞いてもいいですか。"}, {"turn_id": 46, "ms": 131280, "end_ms": 148920, "speaker": "未確定", "text": "さっきも紹介してもらいましたけど、ホチさんとかオマツさんたちの引っ越したの代で、神戸女学園に中学から入ってます。中学はバドミントン部で、しばらく部活だけやってたんですけど、そのぐらいの頃からスマートフォンを手に入れて、"}, {"turn_id": 47, "ms": 151980, "end_ms": 158280, "speaker": "未確定", "text": "中学を引退したぐらいでTwitterを始め、そこでちょっと学外の交流ができてしまう。"}, {"turn_id": 48, "ms": 158520, "end_ms": 159000, "speaker": "未確定", "text": "交流ね。"}, {"turn_id": 49, "ms": 159180, "end_ms": 164760, "speaker": "未確定", "text": "その流れで、ちょっとだんだんだんだん音ゲー界隈とか。"}, {"turn_id": 50, "ms": 165360, "end_ms": 169560, "speaker": "参加者A", "text": "ができて、例えば誰？音ゲー界隈は。"}, {"turn_id": 51, "ms": 169800, "end_ms": 172920, "speaker": "未確定", "text": "同じラインやったら、柑橘さん。"}, {"turn_id": 52, "ms": 174660, "end_ms": 176400, "speaker": "参加者A", "text": "ホチのプロ野球スピリッツ日本一。"}, {"turn_id": 53, "ms": 177060, "end_ms": 177720, "speaker": "未確定", "text": "どうなんですか。"}, {"turn_id": 54, "ms": 177900, "end_ms": 178800, "speaker": "参加者A", "text": "はい。アマチュア無線部。"}, {"turn_id": 55, "ms": 178920, "end_ms": 180240, "speaker": "未確定", "text": "そうですか。あと誰かな。"}, {"turn_id": 56, "ms": 180420, "end_ms": 181560, "speaker": "参加者C", "text": "日野県上本町校。"}, {"turn_id": 57, "ms": 181680, "end_ms": 181920, "speaker": "未確定", "text": "誰かな。"}, {"turn_id": 58, "ms": 182100, "end_ms": 183240, "speaker": "参加者A", "text": "お父さんのことさんずけで呼ぶ。"}, {"turn_id": 59, "ms": 184620, "end_ms": 185280, "speaker": "参加者A", "text": "柑橘。"}, {"turn_id": 60, "ms": 187140, "end_ms": 188160, "speaker": "参加者A", "text": "で、ペインフっていう人。"}, {"turn_id": 61, "ms": 188460, "end_ms": 194880, "speaker": "未確定", "text": "あー、ペインフルさんもいましたね。そういう人たちと仲良くて、いわゆるオパサーの姫みたいな、たぶん。"}, {"turn_id": 62, "ms": 195060, "end_ms": 196680, "speaker": "未確定", "text": "自分で言える。"}, {"turn_id": 63, "ms": 197160, "end_ms": 197520, "speaker": "未確定", "text": "いいね。"}, {"turn_id": 64, "ms": 197820, "end_ms": 198960, "speaker": "参加者A", "text": "大人やな、こんな。"}, {"turn_id": 65, "ms": 199140, "end_ms": 199320, "speaker": "未確定", "text": "うん。"}, {"turn_id": 66, "ms": 199440, "end_ms": 200280, "speaker": "未確定", "text": "もう27歳ですから。"}, {"turn_id": 67, "ms": 200460, "end_ms": 201720, "speaker": "参加者A", "text": "当時は言えへんかったやろうけど。"}, {"turn_id": 68, "ms": 201900, "end_ms": 203400, "speaker": "未確定", "text": "認めたくなかったですけど。"}, {"turn_id": 69, "ms": 203580, "end_ms": 208440, "speaker": "参加者A", "text": "完全に姫やった。正直。みんなうっすら朱色のこと好きという状態。"}, {"turn_id": 70, "ms": 208620, "end_ms": 209040, "speaker": "未確定", "text": "うんうん。"}, {"turn_id": 71, "ms": 209160, "end_ms": 213840, "speaker": "未確定", "text": "ランドワンに今日行きますって言って、どうしたら。"}, {"turn_id": 72, "ms": 215580, "end_ms": 216480, "speaker": "未確定", "text": "奈良坂。"}, {"turn_id": 73, "ms": 217260, "end_ms": 218760, "speaker": "未確定", "text": "ほんとに。"}, {"turn_id": 74, "ms": 218820, "end_ms": 219960, "speaker": "未確定", "text": "多い時15人ぐらい。"}, {"turn_id": 75, "ms": 221340, "end_ms": 222000, "speaker": "参加者A", "text": "すごい。"}, {"turn_id": 76, "ms": 222300, "end_ms": 222960, "speaker": "参加者A", "text": "ウメラ？"}, {"turn_id": 77, "ms": 223080, "end_ms": 223560, "speaker": "参加者A", "text": "キモい。"}, {"turn_id": 78, "ms": 223680, "end_ms": 224640, "speaker": "未確定", "text": "そうなんじゃない？はい。"}, {"turn_id": 79, "ms": 224940, "end_ms": 225240, "speaker": "未確定", "text": "サンラ？"}, {"turn_id": 80, "ms": 225360, "end_ms": 225480, "speaker": "未確定", "text": "そう。"}, {"turn_id": 81, "ms": 225720, "end_ms": 227760, "speaker": "未確定", "text": "ウメラ。ジェネがたまに発見。"}, {"turn_id": 82, "ms": 228360, "end_ms": 228600, "speaker": "未確定", "text": "はい。"}];
const SESSION = "2026-07-14_142016";
const KEY = "gt_" + SESSION;
let labels = {};
try { labels = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) {}
let cur = 0, audio = null, stopTimer = null;

const list = document.getElementById("list");
function spName(code){
  if (code === "S1") return document.getElementById("n1").value || "話者1";
  if (code === "S2") return document.getElementById("n2").value || "話者2";
  if (code === "S3") return document.getElementById("n3").value || "話者3";
  if (code === "MULTI") return "複数人";
  if (code === "UNK") return "不明";
  return "—";
}
function fmt(ms){ const s = ms/1000; return Math.floor(s/60)+":"+String((s%60).toFixed(1)).padStart(4,"0"); }

function render(){
  list.innerHTML = "";
  TURNS.forEach((t,i)=>{
    const div = document.createElement("div");
    div.className = "turn" + (i===cur?" current":"") + (labels[t.turn_id]?" labeled":"");
    div.innerHTML = `
      <div class="tid">#${t.turn_id}<br>${fmt(t.ms)}</div>
      <div class="txt">${t.text}<div class="sys">システム: ${t.speaker}</div></div>
      <div class="gt ${labels[t.turn_id]?"set":""}">${spName(labels[t.turn_id])}</div>
      <div class="btns">
        <button data-i="${i}" data-c="S1">1</button>
        <button data-i="${i}" data-c="S2">2</button>
        <button data-i="${i}" data-c="S3">3</button>
        <button data-i="${i}" data-c="MULTI">複</button>
        <button data-i="${i}" data-c="UNK">?</button>
        <button data-i="${i}" data-c="PLAY">▶</button>
      </div>`;
    div.addEventListener("click", e => {
      if (e.target.tagName === "BUTTON") {
        const c = e.target.dataset.c;
        if (c === "PLAY") { select(i); play(); }
        else assign(i, c);
      } else select(i);
    });
    list.appendChild(div);
  });
  const done = TURNS.filter(t=>labels[t.turn_id]).length;
  document.getElementById("progress").textContent = `進捗: ${done} / ${TURNS.length}`;
}
function select(i, scroll=true){
  cur = Math.max(0, Math.min(TURNS.length-1, i));
  render();
  if (scroll) list.children[cur].scrollIntoView({block:"center", behavior:"smooth"});
}
function assign(i, code){
  labels[TURNS[i].turn_id] = code;
  localStorage.setItem(KEY, JSON.stringify(labels));
  select(i+1);
  play();
}
function play(pad=0){
  if (!audio) { document.getElementById("status").textContent = "先に wav を選択してください"; return; }
  const t = TURNS[cur];
  clearTimeout(stopTimer);
  audio.currentTime = Math.max(0, t.ms/1000 - pad);
  audio.play();
  const dur = (t.end_ms - t.ms)/1000 + pad*2 + 0.15;
  stopTimer = setTimeout(()=>audio.pause(), dur*1000);
}
document.getElementById("wav").addEventListener("change", e=>{
  const f = e.target.files[0];
  if (!f) return;
  audio = new Audio(URL.createObjectURL(f));
  document.getElementById("status").textContent = "音声OK: " + f.name;
  play();
});
document.getElementById("showsys").addEventListener("change", e=>{
  document.body.classList.toggle("showsys", e.target.checked);
});
["n1","n2","n3"].forEach(id=>document.getElementById(id).addEventListener("input", render));
document.getElementById("export").addEventListener("click", ()=>{
  const done = TURNS.filter(t=>labels[t.turn_id]).length;
  const out = {
    session: SESSION,
    created: new Date().toISOString(),
    speaker_names: {S1: spName("S1"), S2: spName("S2"), S3: spName("S3")},
    labeled: done, total: TURNS.length,
    labels: labels
  };
  const blob = new Blob([JSON.stringify(out, null, 1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `gt_${SESSION}.json`;
  a.click();
  document.getElementById("status").textContent = `保存しました（${done}/${TURNS.length}件）。eval/ フォルダに置いてください`;
});
document.getElementById("clear").addEventListener("click", ()=>{
  if (confirm("全てのラベルを消しますか？")) { labels = {}; localStorage.removeItem(KEY); render(); }
});
document.addEventListener("keydown", e=>{
  if (e.target.tagName === "INPUT") return;
  if (e.key === "1") assign(cur, "S1");
  else if (e.key === "2") assign(cur, "S2");
  else if (e.key === "3") assign(cur, "S3");
  else if (e.key === "9") assign(cur, "MULTI");
  else if (e.key === "0") assign(cur, "UNK");
  else if (e.key === " ") { e.preventDefault(); play(); }
  else if (e.key === "r" || e.key === "R") play(1.0);
  else if (e.key === "ArrowDown") { e.preventDefault(); select(cur+1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); select(cur-1); }
});
render();
</script>
</body>
