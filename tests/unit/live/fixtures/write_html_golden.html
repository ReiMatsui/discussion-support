<div class="stats-section"><p class="sidebar-title">発言量</p><div class="stats-group"><div class="stats-label">発話時間</div><div class="stats-row"><span class="stats-name" title="参加者B">参加</span><div class="stats-bar-bg"><div class="stats-bar" style="width:68%;background:#a16207"></div></div><span class="stats-pct">68%</span></div><div class="stats-row"><span class="stats-name" title="参加者A">参加</span><div class="stats-bar-bg"><div class="stats-bar" style="width:27%;background:#0e7490"></div></div><span class="stats-pct">27%</span></div><div class="stats-row"><span class="stats-name" title="未確定">未確定</span><div class="stats-bar-bg"><div class="stats-bar" style="width:5%;background:#7e22ce"></div></div><span class="stats-pct">5%</span></div></div><div class="stats-group"><div class="stats-label">文字数</div><div class="stats-row"><span class="stats-name" title="参加者B">参加</span><div class="stats-bar-bg"><div class="stats-bar" style="width:36%;background:#a16207"></div></div><span class="stats-pct">36%</span></div><div class="stats-row"><span class="stats-name" title="参加者A">参加</span><div class="stats-bar-bg"><div class="stats-bar" style="width:45%;background:#0e7490"></div></div><span class="stats-pct">45%</span></div><div class="stats-row"><span class="stats-name" title="未確定">未確定</span><div class="stats-bar-bg"><div class="stats-bar" style="width:18%;background:#7e22ce"></div></div><span class="stats-pct">18%</span></div></div><div class="stats-group"><div class="stats-label">発話回数</div><div class="stats-row"><span class="stats-name" title="参加者B">参加</span><div class="stats-bar-bg"><div class="stats-bar" style="width:33%;background:#a16207"></div></div><span class="stats-pct">33%</span></div><div class="stats-row"><span class="stats-name" title="参加者A">参加</span><div class="stats-bar-bg"><div class="stats-bar" style="width:33%;background:#0e7490"></div></div><span class="stats-pct">33%</span></div><div class="stats-row"><span class="stats-name" title="未確定">未確定</span><div class="stats-bar-bg"><div class="stats-bar" style="width:33%;background:#7e22ce"></div></div><span class="stats-pct">33%</span></div></div></div>

<div class="agent-section" data-mode="facilitator"><div class="agent-header"><span class="agent-label">🤖 AI Agent</span><span class="agent-conn">接続中</span></div><div class="agent-modes"><button class="agent-mode-btn" data-mode="off" onclick="setAgentMode(this)">OFF</button><button class="agent-mode-btn active" data-mode="facilitator" onclick="setAgentMode(this)">進行役</button><button class="agent-mode-btn" data-mode="conversation" onclick="setAgentMode(this)">会話</button></div><div class="agent-opts"><label class="agent-opt-label">声<select class="agent-select" onchange="setAgentVoice(this)"><option value="alloy" >alloy</option><option value="ash" >ash</option><option value="ballad" >ballad</option><option value="coral" >coral</option><option value="echo" >echo</option><option value="sage" >sage</option><option value="shimmer" selected>shimmer</option><option value="verse" >verse</option><option value="marin" >marin</option><option value="cedar" >cedar</option></select></label><label class="agent-opt-label agent-trigger-row">間隔 <input type="number" class="agent-num" value="10" min="1" max="50" onchange="setAgentTrigger(this)">発話</label></div></div>
</div>
</div>
<script>
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
async function _agentCfg(data) {
  try {
    var res = await fetch('/agent', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    if (res.ok) { var d = await res.json(); _updateAgentUI(d); }
  } catch(e) {}
}
function _updateAgentUI(d) {
  var sec = document.querySelector('.agent-section');
  if (!sec) return;
  sec.dataset.mode = d.mode || 'off';
  sec.querySelectorAll('.agent-mode-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.mode === d.mode);
  });
}
function setAgentMode(btn) {
  _agentCfg({mode: btn.dataset.mode});
}
function setAgentVoice(sel) {
  _agentCfg({voice: sel.value});
}
function setAgentTrigger(inp) {
  var v = parseInt(inp.value);
  if (v > 0) _agentCfg({trigger_n: v});
}
async function forgetProfile(el) {
  var name = el.dataset.name;
  if (!confirm('「' + name + '」の登録した声を削除します。
' +
               'この会議の表示は変わりませんが、以後この声には照合しません。')) return;
  try {
    var res = await fetch('/api/forget', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: name})
    });
    if (res.ok) location.reload();
    else { var d = await res.json(); alert(d.error || '削除失敗'); }
  } catch(e) {}
}
async function toggleProfile(el) {
  var name = el.dataset.name;
  var isActive = el.classList.contains('active');
  try {
    var res = await fetch('/activate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: name, active: !isActive})
    });
    if (res.ok) location.reload();
    else { var d = await res.json(); alert(d.error || '切替失敗'); }
  } catch(e) {}
}
async function rename(btn) {
  var input = btn.parentElement.querySelector('.rename-input');
  var label = input.dataset.label;
  var name = input.value.trim();
  if (!name) return;
  btn.disabled = true;
  try {
    var res = await fetch('/rename', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({label: label, name: name})
    });
    if (res.ok) location.reload();
    else { var d = await res.json(); alert(d.error || '登録失敗'); btn.disabled = false; }
  } catch(e) { btn.disabled = false; }
}
document.querySelectorAll('.rename-input').forEach(function(input) {
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') rename(input.nextElementSibling);
  });
});
window.scrollTo(0, document.body.scrollHeight);
</script>
</body></html>
